{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Webordo CRM</title>
  <link rel="stylesheet" href="{% static 'crm/app.css' %}?v={{ asset_version }}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)">
  <div class="card" style="width:340px;padding:32px 28px">
    <div class="brand" style="padding:0 0 24px;justify-content:center"><span class="dot"></span> Webordo CRM</div>
    <h2 style="text-align:center;margin-bottom:20px">Вход</h2>
    {% if form.errors %}<p class="badge red" style="display:flex;justify-content:center;padding:8px;margin-bottom:12px">Неверный логин или пароль</p>{% endif %}
    <form method="post" class="stack">
      {% csrf_token %}
      <div class="form-row">
        <label for="id_username">Логин</label>
        <input class="field-input" type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="form-row">
        <label for="id_password">Пароль</label>
        <input class="field-input" type="password" name="password" id="id_password" required>
      </div>
      <button class="btn block lg" type="submit" style="margin-top:8px">Войти</button>
    </form>
  </div>
</body>
</html>
