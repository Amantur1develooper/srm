services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: webordo_srm
      POSTGRES_USER: webordo
      POSTGRES_PASSWORD: webordo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webordo -d webordo_srm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
